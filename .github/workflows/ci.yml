name: CI
on: [push]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: nodeversion
        run: echo "version=$(grep nodejs .tool-versions | sed -e 's/[^[:space:]]*[[:space:]]*//')" >> $GITHUB_OUTPUT
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.nodeversion.outputs.version }}
          cache: yarn
      - run: yarn install --immutable
      - run: yarn build
      - run: yarn check:coverage
        env:
          REPORT_GAS: "true"
      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
  formal-verfication:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        ruleset:
          - "termAuction.conf"
          - "termAuctionBidLocker.conf"
          - "termAuctionOfferLocker.conf"
          - "termAuctionOfferLocker-stateVariables.conf"
          - "termRepoCollateralManager-batchDefault.conf"
          - "termRepoCollateralManager-batchLiquidation.conf"
          - "termRepoCollateralManager-batchLiquidationWithRepoToken.conf"
          - "termRepoCollateralManager-stateVariables.conf"
          - "termRepoCollateralManager.conf"
          - "termRepoLocker.conf"
          - "termRepoRolloverManager.conf"
          - "termRepoServicer.conf"
          - "termRepoServicer-lockFulfill.conf"
          - "termRepoServicer-lockFulfillReverts.conf"
          - "termRepoServicer-mintCollapse.conf"
          - "termRepoServicer-mintCollapseReverts.conf"
          - "termRepoServicer-repaymentsRedemptions.conf"
          - "termRepoServicer-repaymentsRedemptionsReverts.conf"
          - "termRepoServicer-stateVariables.conf"
          - "termRepoToken.conf"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: nodeversion
        run: echo "version=$(grep nodejs .tool-versions | sed -e 's/[^[:space:]]*[[:space:]]*//')" >> $GITHUB_OUTPUT
      - id: pythonversion
        run: echo "version=$(grep python .tool-versions | sed -e 's/[^[:space:]]*[[:space:]]*//')" >> $GITHUB_OUTPUT
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.nodeversion.outputs.version }}
          cache: yarn
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ steps.pythonversion.outputs.version }}
      - run: |
          yarn install --immutable
          yarn build
      - run: |
          pip3 install -r requirements.txt
      - run: |
          pip3 install solc-select
          solc-select install ${SOLC_VERSION}

          certoraRun "./certora/confs/${{ matrix.ruleset }}" \
            --msg "$(hostname) - ${{ matrix.ruleset }} - $(date +%s)" \
            --wait_for_results all \
            --rule_sanity basic
        env:
          CERTORAKEY: ${{ secrets.CERTORAKEY }}
          SOLC_VERSION: 0.8.30
